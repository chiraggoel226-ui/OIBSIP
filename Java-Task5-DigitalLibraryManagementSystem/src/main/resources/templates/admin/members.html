
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Members - Admin</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="admin-layout">

    <aside class="sidebar">

        <h2>📚 Library Admin</h2>

        <a href="/admin/dashboard">
            Dashboard
        </a>

        <a href="/admin/books">
            Manage Books
        </a>

        <a href="/admin/issued-books">
            Issued Books
        </a>

        <a href="/admin/members">
            Members
        </a>

        <a href="/admin/fines">
            Fines
        </a>

        <a href="/admin/queries">
            Queries
        </a>

        <a href="/">
            Back to Website
        </a>

        <a href="/logout">
            Logout
        </a>

    </aside>


    <main class="admin-content">

        <h1>Registered Members</h1>

        <p style="margin:10px 0 30px; color:#64748b;">
            View registered library members.
        </p>


        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Role</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="user : ${users}">

                    <td th:text="${user.id}">
                        1
                    </td>


                    <td th:text="${user.name}">
                        Rahul Sharma
                    </td>


                    <td th:text="${user.email}">
                        rahul@example.com
                    </td>


                    <td th:text="${user.role}">
                        USER
                    </td>

                </tr>


                <tr th:if="${#lists.isEmpty(users)}">

                    <td
                            colspan="4"
                            style="text-align:center; padding:25px; color:#64748b;">

                        No registered members found.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>

</html>
