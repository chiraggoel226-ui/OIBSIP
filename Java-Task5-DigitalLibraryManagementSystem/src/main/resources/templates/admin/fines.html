
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fines - Admin</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="admin-layout">

    <aside class="sidebar">

        <h2>📚 Library Admin</h2>

        <a href="/admin/dashboard">
            Dashboard
        </a>

        <a href="/admin/books">
            Manage Books
        </a>

        <a href="/admin/issued-books">
            Issued Books
        </a>

        <a href="/admin/members">
            Members
        </a>

        <a href="/admin/fines">
            Fines
        </a>

        <a href="/admin/queries">
            Queries
        </a>

        <a href="/">
            Back to Website
        </a>

        <a href="/logout">
            Logout
        </a>

    </aside>


    <main class="admin-content">

        <h1>Fine Management</h1>

        <p style="margin:10px 0 30px; color:#64748b;">
            View overdue fines and manage fine payments.
        </p>


        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>Fine ID</th>

                    <th>Member</th>

                    <th>Book</th>

                    <th>Due Date</th>

                    <th>Fine Amount</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="fine : ${fines}">

                    <td th:text="${fine.id}">
                        1
                    </td>


                    <td th:text="${fine.user.name}">
                        Aman Kumar
                    </td>


                    <td th:text="${fine.issue.book.title}">
                        Clean Code
                    </td>


                    <td th:text="${fine.issue.dueDate}">
                        2026-10-01
                    </td>


                    <td th:text="'₹' + ${fine.amount}">
                        ₹15
                    </td>


                    <td>

                        <span
                                th:if="${!fine.paid}"
                                style="color:#dc2626;">

                            Unpaid

                        </span>


                        <span
                                th:if="${fine.paid}"
                                style="color:#16a34a;">

                            Paid

                        </span>

                    </td>


                    <td>

                        <form
                                th:if="${!fine.paid}"
                                th:action="@{/admin/fines/pay/{id}(id=${fine.id})}"
                                method="post">

                            <button
                                    type="submit"
                                    class="btn btn-success"
                                    onclick="return confirm('Mark this fine as paid?')">

                                Mark Paid

                            </button>

                        </form>


                        <span th:if="${fine.paid}">
                            -
                        </span>

                    </td>

                </tr>


                <tr th:if="${#lists.isEmpty(fines)}">

                    <td
                            colspan="7"
                            style="text-align:center; padding:25px; color:#64748b;">

                        No fines found.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>

</html>
