<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact - Digital Library</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        📚 Digital Library
    </div>

    <ul class="nav-links">

        <li>
            <a href="/">Home</a>
        </li>

        <li>
            <a href="/books">Books</a>
        </li>

        <li>
            <a href="/my-books">My Books</a>
        </li>

        <li>
            <a href="/booking">Bookings</a>
        </li>

        <li>
            <a href="/contact">Contact</a>
        </li>

    </ul>

</nav>


<!-- ================= CONTACT FORM ================= -->

<div class="form-container">

    <div class="form-box">

        <h2>Contact Library</h2>


        <p style="text-align:center;
                  margin-bottom:25px;
                  color:#64748b;">

            Have a question or problem?
            Send a message to the library administrator.

        </p>


        <form action="/contact" method="post">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

            </div>


            <!-- SUBJECT -->

            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter subject"
                        required>

            </div>


            <!-- MESSAGE -->

            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                        id="message"
                        name="message"
                        placeholder="Write your query here..."
                        required></textarea>

            </div>


            <button
                    type="submit"
                    class="btn btn-primary">

                Send Query

            </button>


        </form>

    </div>

</div>


<footer class="footer">

    <p>
        © 2026 Digital Library Management System
    </p>

</footer>


</body>

</html>
