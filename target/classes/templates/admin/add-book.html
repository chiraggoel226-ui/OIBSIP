<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Book - Admin</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="admin-layout">

    <aside class="sidebar">

        <h2>📚 Library Admin</h2>

        <a href="/admin/dashboard">
            Dashboard
        </a>

        <a href="/admin/books">
            Manage Books
        </a>

        <a href="/admin/issues">
            Issued Books
        </a>

        <a href="/admin/users">
            Members
        </a>

        <a href="/admin/fines">
            Fines
        </a>

        <a href="/admin/queries">
            Queries
        </a>

        <a href="/">
            Back to Website
        </a>

        <a href="/logout">
            Logout
        </a>

    </aside>


    <main class="admin-content">

        <h1>Add New Book</h1>

        <p style="margin:10px 0 30px; color:#64748b;">
            Add a new book to the library catalogue.
        </p>


        <div class="form-box">

            <form th:action="@{/admin/books/add}"
                  th:object="${book}"
                  method="post">

                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input
                            type="text"
                            id="title"
                            th:field="*{title}"
                            placeholder="Enter book title"
                            required>

                </div>


                <div class="form-group">

                    <label for="author">
                        Author
                    </label>

                    <input
                            type="text"
                            id="author"
                            th:field="*{author}"
                            placeholder="Enter author name"
                            required>

                </div>


                <div class="form-group">

                    <label for="isbn">
                        ISBN
                    </label>

                    <input
                            type="text"
                            id="isbn"
                            th:field="*{isbn}"
                            placeholder="Enter ISBN"
                            required>

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <input
                            type="text"
                            id="category"
                            th:field="*{category}"
                            placeholder="Enter category"
                            required>

                </div>


                <div class="form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                            type="number"
                            id="quantity"
                            th:field="*{quantity}"
                            min="1"
                            placeholder="Enter quantity"
                            required>

                </div>


                <button
                        type="submit"
                        class="btn btn-primary">

                    Add Book

                </button>


                <a href="/admin/books"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </main>

</div>

</body>

</html>
